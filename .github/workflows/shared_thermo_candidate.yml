name: Shared thermodynamics candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Personal candidate version
        required: false
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'neqsim-mcp-server/**'
      - 'devtools/*shared_thermo*'
      - 'distribution/cupbhan/**'
      - '.github/workflows/shared_thermo_candidate.yml'

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test distribution safeguards
        run: python devtools/test_build_shared_thermo.py
      - name: Build and validate candidate
        env:
          CANDIDATE_VERSION: ${{ inputs.version || format('3.17.0-cupbhan.1-rc.{0}', github.run_id) }}
        run: python devtools/build_shared_thermo.py --version "$CANDIDATE_VERSION"
      - name: Save candidate and validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shared-thermo-candidate-${{ github.run_id }}
          path: build/shared-thermo/
          if-no-files-found: warn
