name: Shared thermodynamics candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Personal candidate version
        required: false
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'neqsim-mcp-server/**'
      - 'devtools/*shared_thermo*'
      - 'devtools/*shared_runtime*'
      - 'devtools/*shared_enhancements*'
      - 'devtools/*sync_upstream*'
      - 'bindings/python/**'
      - 'distribution/cupbhan/**'
      - '.github/workflows/shared_thermo_candidate.yml'

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test distribution safeguards
        run: |
          python devtools/test_build_shared_thermo.py
          python devtools/test_shared_runtime.py
          python devtools/test_sync_upstream.py
          python devtools/test_verify_shared_enhancements.py
      - name: Select a personal version for the recorded official baseline
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          upstream = json.loads(Path('distribution/cupbhan/upstream.json').read_text())
          version = os.environ.get('REQUESTED_VERSION') or f"{upstream['version']}-cupbhan.1-rc.{os.environ['GITHUB_RUN_ID']}"
          if not re.fullmatch(r'\d+\.\d+\.\d+-cupbhan\.\d+(?:-rc\.\d+)?', version):
              raise ValueError('Invalid personal candidate version')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'CANDIDATE_VERSION={version}\n')
          PY
      - name: Build and validate candidate
        run: python devtools/build_shared_thermo.py --version "$CANDIDATE_VERSION"
      - name: Save candidate and validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shared-thermo-candidate-${{ github.run_id }}
          path: build/shared-thermo/
          if-no-files-found: warn
